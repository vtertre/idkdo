<section class="panel" aria-labelledby="create-event-title">
  <h1 id="create-event-title">Create an Event</h1>
  <p>Start a private place where your group can coordinate gifts.</p>

  <form (submit)="onSubmit($event)" novalidate>
    <label for="event-name">Event name</label>
    <input
      id="event-name"
      type="text"
      autocomplete="off"
      [formField]="eventForm.name"
      [attr.aria-describedby]="
        eventForm.name().touched() && eventForm.name().invalid()
          ? 'event-name-error'
          : null
      "
      [attr.aria-invalid]="
        eventForm.name().touched() && eventForm.name().invalid() ? 'true' : null
      "
    />

    @if (eventForm.name().touched() && eventForm.name().invalid()) {
      <p class="field-error" id="event-name-error">
        Enter an Event name.
      </p>
    }

    <button type="submit" [disabled]="eventForm().submitting()">
      {{ eventForm().submitting() ? "Creating…" : "Create Event" }}
    </button>

    @if (submitError()) {
      <p class="submit-error" aria-live="polite">{{ submitError() }}</p>
    }
  </form>
</section>
