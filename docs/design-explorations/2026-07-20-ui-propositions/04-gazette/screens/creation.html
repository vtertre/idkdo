<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gazette — Créer un événement</title><link rel="stylesheet" href="../style.css"></head>
<body>
<div class="sheet frontpage" style="max-width:560px;">
  <header class="masthead">
    <div class="lab eyebrow">La coordination de cadeaux, sans divulgâcher</div>
    <h1 style="font-size:52px;">idkdo</h1>
    <p class="tagline">Fondez votre édition familiale.</p>
  </header>

  <div class="ornament">❦</div>

  <div style="text-align:left;">
    <label class="field"><span class="lab">Le nom de votre événement</span>
      <input type="text" value="Noël 2026">
    </label>
    <button class="btnl primary block">Fonder l'édition</button>
  </div>

  <div class="section-head lab">après création</div>

  <div style="text-align:left;">
    <h2 class="h2" style="text-align:center;">« Noël 2026 » est paru</h2>
    <p class="lede" style="text-align:center;">Faites circuler le lien ; chacun choisira son nom en ouvrant l'édition.</p>
    <div class="linkline"><span class="lab" style="color:var(--gold);">Lien</span><code>idkdo.app/e/9f3a7c</code><button class="textlink">Copier</button></div>
    <p style="text-align:center;margin-top:20px;"><a class="btnl" href="entree.html">Ouvrir l'événement</a></p>
  </div>

  <footer class="folio lab"><span>idkdo</span><span>hiver 2026</span></footer>
</div>
</body>
</html>
