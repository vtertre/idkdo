name: Verify Docs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Verify documentation harness
        run: |
          node scripts/verify-docs.mjs
          git diff --check
